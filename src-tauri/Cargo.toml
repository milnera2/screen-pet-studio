[package]
name = "screen-pet-studio"
version = "0.1.0"
description = "A gamified desktop companion"
authors = ["Screen Pet Studio"]
edition = "2021"

[lib]
name = "screen_pet_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
